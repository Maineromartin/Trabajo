<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer ejemplo</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>¡Hola, Mundo!</h1>
    <p>Ingresa tu nombre: </p>
    <!-- Agregamos id a input y button para seleccionarlos en JS-->
    <input type="text" id="nombreInput" placeholder="Escribe tu nombre">
    <button id="saludarBtn">Saludar</button>
    <!-- Aca mostramos el resultado-->
    <h2 id="mensajeSaludo" ></h2>


    <!-- Conectamos nuestro archivo con JavaScript-->
    <script src="script.js"></script>
</body>
</html>
